        <label for="Vorname">Vorname: </label>

        <label for="Nachname">Nachname: </label>

        <!-- Checkbox -->
         <b>Interessen:</b>
         <br>
         <input type="checkbox" name="hobby" value="Sport"> Sport

         <input type="checkbox" name="hobby" value="kochen"> Kochen
         <input type="checkbox" name="hobby" value="It"> IT
         <br><br>
         
         <!-- Dropdown -->
        <b>Lieblingsfarbe: </b>
        <select name="farbe">
            <option value="blau">Blau</option>
            <option value="grün">Grün</option>
            <option value="rot">Rot</option>
            <option value="gelb">Gelb</option>
        </select>
        <br><br>

        <!-- Merhfachauswahl -->
         <b>Handymarke: </b>
         <br>
        <select name="handy" multiple>
            <option value="Iphone">Iphone</option>
            <option value="Samsung">Samsung</option>
            <option value="Huawai">Huawai</option>
        </select>
        <br><br>

        <!-- Mehrzeilige Textfelder -->
        <textarea name="Kommentar" placeholder="Fügen Sie Ihren Kommentar ein!"></textarea>
        <br><br>

        <!-- Und ein weiteres Eingabefeld -->
         <label for="Interessen" name="WeitereInteressen" id="WeitereInteressen" >Weiter Interessen: </label>
         <input type="text" placeholder="Gym">
        <br><br>


         <!-- Button -->
          <input type="submit"
          value="Formular abschicken">
          <input type="reset"
          value="Formular zurücksetzen">
        
    </form>
